name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write # create the GitHub Release on tag push
  id-token: write # OIDC: required for npm trusted publishing AND provenance

env:
  # Force JS-based GitHub Actions (actions/checkout@v5,
  # actions/setup-node@v5, etc.) to run under Node 24 ahead of GitHub's
  # 2026-06-02 default flip and 2026-09-16 Node-20 removal. Same
  # rationale as marketintellabs/.github/workflows/deploy.yml — the
  # action versions themselves are current, but their JS runtime on
  # the runner still defaults to Node 20. This env var is the official
  # opt-in documented in the deprecation notice. It does NOT change the
  # Node version used for `npm ci` / `npm run build` (that's set by
  # actions/setup-node's `node-version: '24'`).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  publish:
    name: Publish to npm
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          registry-url: 'https://registry.npmjs.org'

      # Trusted publishing (OIDC) requires npm >= 11.5.1. Node 24's bundled
      # npm can lag that, so pin a known-good npm before anything else. Also
      # surfaces the version in the log for troubleshooting ENEEDAUTH issues.
      - name: Ensure npm supports OIDC trusted publishing (>= 11.5.1)
        run: |
          npm install -g npm@latest
          echo "npm $(npm -v) / node $(node -v)"

      - run: npm ci

      - run: npm run typecheck

      - run: npm run build

      - name: Verify dist + shipped template
        run: test -f dist/server/execute.js && test -f templates/mil-heartbeat.md

      # Run the full test suite before publish. The CI workflow already
      # gates merges on tests, but a tag push can come from anywhere
      # (including a hand-crafted tag on an old commit), so we re-run
      # tests on the exact ref about to be published. Two release-
      # hygiene guards live inside the test suite (added in 0.9.4-mil.0
      # after the 0.9.2/0.9.3 silent under-report incident):
      #
      #   src/shared/version.test.ts asserts:
      #     1. ADAPTER_VERSION constant in src/shared/version.ts matches
      #        package.json. If it drifts, every heartbeat run on the
      #        fleet silently under-reports its adapter version and
      #        tooling like bake-spotcheck.mjs / check-pilot.mjs lies.
      #     2. ADAPTER_VERSION follows the MAJOR.MINOR.PATCH-mil.N
      #        prerelease shape this fork requires.
      - run: npm test

      - name: Verify git tag matches package.json
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          PKG_VERSION="$(node -p "require('./package.json').version")"
          TAG="${GITHUB_REF#refs/tags/v}"
          if [ "$PKG_VERSION" != "$TAG" ]; then
            echo "::error::tag v$TAG does not match package.json version $PKG_VERSION"
            exit 1
          fi
          echo "Tag v$TAG matches package.json version $PKG_VERSION"

      - name: Publish to npm (OIDC trusted publishing)
        run: |
          # Trusted publishing via OIDC — NO long-lived NPM_TOKEN. The npm CLI
          # detects the GitHub Actions OIDC environment (granted by the
          # `id-token: write` permission below) and exchanges it for a
          # short-lived publish token. Requires:
          #   1. npm >= 11.5.1 (ensured by the step above).
          #   2. A Trusted Publisher configured on npmjs.com for this package:
          #      GitHub Actions / org `marketintellabs` /
          #      repo `hermes-paperclip-adapter` / workflow `release.yml` /
          #      allowed action `npm publish`.
          #   3. package.json `repository.url` matching the GitHub repo (it does).
          #
          # We publish STRAIGHT to the `latest` dist-tag. This fork has no
          # non-prerelease stream, so `latest` is effectively MIL (npmjs.com
          # renders the README of whatever `latest` points at). The old
          # "publish to `mil`, then `npm dist-tag add ... latest`" two-step is
          # NOT compatible with OIDC: only `npm publish` / `npm stage publish`
          # are OIDC-authenticated — `npm dist-tag` still needs a long-lived
          # token, which is exactly what we're eliminating. Consumers pin exact
          # versions (paperclip/Dockerfile -> @x.y.z-mil.N), so the `mil` tag was
          # never load-bearing for deploys.
          #
          # Provenance is generated automatically under OIDC from a public repo;
          # `--provenance` is kept explicit so a misconfiguration fails loudly
          # rather than silently dropping attestations.
          npm publish --access public --provenance --tag latest

      # Create a GitHub Release on every tag push so the npmjs.com
      # "Version history" panel shows release notes (npm pulls them
      # from the repository's Releases, not from CHANGELOG or tags).
      # Skipped on workflow_dispatch since there's no tag to attach to.
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF#refs/tags/}"
          # If somebody pre-created the release manually (e.g. backfill),
          # don't fail the workflow — just log and move on.
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists — leaving it alone."
            exit 0
          fi
          # --generate-notes fills in the body from merged PRs / commits
          # since the previous tag. Maintainers can edit the release
          # afterwards to add a highlights section.
          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --verify-tag
